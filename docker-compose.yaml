services:
  f5-securechat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f5-securechat-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    volumes:
      - ./static:/app/static
      - ./app.py:/app/app.py
    restart: unless-stopped
